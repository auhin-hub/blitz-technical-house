# Build the Astro site and deploy it to GitHub Pages.
#
# Base-aware (BRIEF §C): astro.config.mjs sets `site` + `base`, so the official
# withastro/action builds the correct subpath automatically.
#
# One-time enablement (do this AFTER the first green build):
#   Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Until then this workflow still builds on every push (catching breakage early);
# only the deploy job needs Pages switched on.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Astro site
        uses: withastro/action@v3
        # Reads Node version from .nvmrc; installs deps; runs `astro build`;
        # uploads ./dist as the Pages artifact.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
